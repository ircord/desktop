name: Build desktop installers
on:
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Full commit SHA from ircord/frontend
        required: true
        type: string
  workflow_call:
    inputs:
      frontend_sha:
        required: true
        type: string
      frontend_tag:
        required: true
        type: string
      desktop_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      signed_updates:
        required: true
        type: boolean
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            bundle: dmg
            extension: dmg
          - platform: windows-x64
            runner: windows-2025
            bundle: nsis
            extension: exe
          - platform: linux-x64
            runner: ubuntu-24.04
            bundle: deb
            extension: deb

    env:
      FRONTEND_SHA: ${{ inputs.frontend_sha }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate the frontend revision
        run: |
          if [[ ! "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Enter a full commit SHA from ircord/frontend.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: desktop
          ref: ${{ inputs.desktop_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ircord/frontend
          ref: ${{ inputs.frontend_sha }}
          path: frontend
          persist-credentials: false
      - name: Verify the frontend checkout
        run: test "$(git -C frontend rev-parse HEAD)" = "$FRONTEND_SHA"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Compile IRCord
        working-directory: desktop
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
          IRCORD_DESKTOP_FRONTEND_TAG: ${{ inputs.frontend_tag }}
          IRCORD_DESKTOP_UPDATES: ${{ inputs.signed_updates && runner.os != 'Linux' && '1' || '' }}
        run: |
          config=()
          if [[ -n "$DESKTOP_VERSION" ]]; then
            [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            config=(--config "{\"version\":\"$DESKTOP_VERSION\"}")
          fi
          bun run build --ci --no-bundle "${config[@]}" -- --locked
      - name: Test the native code
        working-directory: desktop/src-tauri
        run: cargo test --locked --release --features custom-protocol
      - name: Bundle the installer
        working-directory: desktop
        env:
          BUNDLE_KIND: ${{ matrix.bundle }}
          DESKTOP_VERSION: ${{ inputs.version }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          SIGNED_UPDATES: ${{ inputs.signed_updates && runner.os != 'Linux' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed_updates && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed_updates && runner.os != 'Linux' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          config=()
          bundles=("$BUNDLE_KIND")
          if [[ -n "$DESKTOP_VERSION" ]]; then
            [[ "$DESKTOP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            config=(--config "{\"version\":\"$DESKTOP_VERSION\"}")
          fi
          if [[ "$SIGNED_UPDATES" == true ]]; then
            if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
              echo 'The desktop update signing key is missing.' >&2
              exit 1
            fi
            if [[ "$BUNDLE_KIND" == dmg ]]; then
              bundles+=(app)
            fi
            config+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          bun tauri bundle --ci --bundles "${bundles[@]}" "${config[@]}"
      - name: Collect the installer and source revisions
        working-directory: desktop
        env:
          BUNDLE_KIND: ${{ matrix.bundle }}
          BUNDLE_EXT: ${{ matrix.extension }}
          SIGNED_UPDATES: ${{ inputs.signed_updates && runner.os != 'Linux' }}
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/"$BUNDLE_KIND"/*."$BUNDLE_EXT")
          if [[ ${#packages[@]} != 1 ]]; then
            echo "Expected one $BUNDLE_KIND installer. Found ${#packages[@]}." >&2
            exit 1
          fi
          mkdir installers
          cp -- "${packages[0]}" installers/
          if [[ "$SIGNED_UPDATES" == true ]]; then
            if [[ "$BUNDLE_KIND" == dmg ]]; then
              updates=(src-tauri/target/release/bundle/macos/*.app.tar.gz)
              if [[ ${#updates[@]} != 1 ]]; then
                echo 'Expected one macOS updater archive.' >&2
                exit 1
              fi
              cp -- "${updates[0]}" "${updates[0]}.sig" installers/
            else
              cp -- "${packages[0]}.sig" installers/
            fi
          fi
          printf 'desktop=%s\nfrontend=%s\n' "$(git rev-parse HEAD)" "$FRONTEND_SHA" \
            > installers/build-info.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ircord-desktop-${{ matrix.platform }}
          path: desktop/installers/
          if-no-files-found: error
      - name: Install and start IRCord on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 3
        working-directory: desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem installers -Filter '*.exe'
          $installPath = Join-Path $env:RUNNER_TEMP 'ircord-install-check'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installPath" -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            throw "The installer exited with code $($setup.ExitCode)."
          }
          $app = Start-Process -FilePath (Join-Path $installPath 'ircord-desktop.exe') -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) {
                throw "IRCord exited with code $($app.ExitCode)."
              }
            } until ($app.MainWindowTitle -eq 'IRCord' -or (Get-Date) -ge $deadline)
            if ($app.MainWindowTitle -ne 'IRCord') {
              throw 'IRCord did not open its setup window.'
            }
          } finally {
            Stop-Process -Id $app.Id -ErrorAction SilentlyContinue
          }

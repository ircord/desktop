<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connect to IRCord</title>
    <link rel="stylesheet" href="./setup.css">
    <script src="./setup.js" defer></script>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="48" height="48" alt="">
      <h1>Connect to IRCord</h1>
      <p>Use the public IRCord server or enter your own server address.</p>
      <form>
        <label for="server-address">Server address</label>
        <input id="server-address" name="server" type="text" inputmode="url" value="https://chat.ircord.com"
          autocomplete="url" autocapitalize="none" spellcheck="false" maxlength="2048"
          aria-describedby="server-status server-error" required>
        <p id="server-status" role="status"></p>
        <p id="server-error" role="alert"></p>
        <button type="submit">Check server</button>
      </form>
    </main>
  </body>
</html>
